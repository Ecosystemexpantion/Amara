name: Send Amara Admin Command

# Manually send an admin command to Amara (as the admin chat), e.g.
# "skip Funke Adams to day 3", "announce saturday", "confirm Mexdon".
# Amara replies with the result in the admin's Telegram chat.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Admin command text to send to Amara"
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send command to Amara webhook
        env:
          CMD: ${{ inputs.command }}
        run: |
          BODY=$(jq -n --arg text "$CMD" '{update_id: 999, message: {message_id: 999, chat: {id: 5870771695, type: "private"}, text: $text}}')
          curl -sS -X POST "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/amara-bot" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -w "\nHTTP %{http_code}\n"
