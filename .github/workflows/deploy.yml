name: Deploy Amara Bot

on:
  workflow_dispatch:
  push:
    branches:
      - claude/amara-eem26-bot-hqB4R

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Supabase secrets
        run: |
          supabase secrets set TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          supabase secrets set GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          supabase secrets set ADMIN_CHAT_ID=5870771695
          if [ -n "$GITHUB_OAUTH_CLIENT_ID" ]; then supabase secrets set GITHUB_OAUTH_CLIENT_ID=$GITHUB_OAUTH_CLIENT_ID; fi
          if [ -n "$GITHUB_OAUTH_CLIENT_SECRET" ]; then supabase secrets set GITHUB_OAUTH_CLIENT_SECRET=$GITHUB_OAUTH_CLIENT_SECRET; fi
          if [ -n "$GROQ_API_KEY" ]; then supabase secrets set GROQ_API_KEY=$GROQ_API_KEY; fi
          if [ -n "$GEMINI_API_KEY_2" ]; then supabase secrets set GEMINI_API_KEY_2=$GEMINI_API_KEY_2; fi
          if [ -n "$GEMINI_API_KEY_3" ]; then supabase secrets set GEMINI_API_KEY_3=$GEMINI_API_KEY_3; fi
          if [ -n "$GEMINI_API_KEY_4" ]; then supabase secrets set GEMINI_API_KEY_4=$GEMINI_API_KEY_4; fi
          if [ -n "$GEMINI_API_KEY_5" ]; then supabase secrets set GEMINI_API_KEY_5=$GEMINI_API_KEY_5; fi
          if [ -n "$FISHAUDIO_API_KEY" ]; then supabase secrets set FISHAUDIO_API_KEY=$FISHAUDIO_API_KEY; fi
          if [ -n "$FISHAUDIO_VOICE_ID" ]; then supabase secrets set FISHAUDIO_VOICE_ID=$FISHAUDIO_VOICE_ID; fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          FISHAUDIO_API_KEY: ${{ secrets.FISHAUDIO_API_KEY }}
          FISHAUDIO_VOICE_ID: ${{ secrets.FISHAUDIO_VOICE_ID }}

      - name: Deploy amara-bot function
        run: supabase functions deploy amara-bot --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy amara-day-unlock function
        run: supabase functions deploy amara-day-unlock --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy github-oauth function
        run: supabase functions deploy github-oauth --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy student-bot function
        run: supabase functions deploy student-bot --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set Telegram webhook for Amara
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -H "Content-Type: application/json" \
            -d "{\"url\": \"https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/amara-bot\"}"
