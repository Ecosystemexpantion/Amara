<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chat with us</title>
<meta name="description" content="Chat with us — we reply instantly, day and night.">
<meta name="theme-color" content="#008069" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202C33" media="(prefers-color-scheme: dark)">
<style>
:root{
  --head:#008069;--head-text:#fff;--head-sub:rgba(255,255,255,.82);
  --wall:#EFEAE2;--doodle:rgba(84,101,111,.07);
  --in:#FFFFFF;--out:#D9FDD3;--text:#111B21;--meta:#667781;--tick:#53BDEB;
  --link:#027EB5;--chip:#FFFFFF;--chip-text:#54656F;--note:#FFEECD;--note-text:#54656F;
  --bar:#F0F2F5;--field:#FFFFFF;--accent:#00A884;--red:#EA0038;--shadow:0 1px .5px rgba(11,20,26,.13);
}
@media (prefers-color-scheme:dark){:root{
  --head:#202C33;--head-text:#E9EDEF;--head-sub:#8696A0;
  --wall:#0B141A;--doodle:rgba(255,255,255,.035);
  --in:#202C33;--out:#005C4B;--text:#E9EDEF;--meta:rgba(233,237,239,.6);--tick:#53BDEB;
  --link:#53BDEB;--chip:#182229;--chip-text:#8696A0;--note:#182229;--note-text:#FFD279;
  --bar:#202C33;--field:#2A3942;--accent:#00A884;--red:#F15C6D;--shadow:0 1px .5px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--wall)}
body{color:var(--text);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--head);color:var(--head-text);box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:2}
.av{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:1.05rem;color:#fff;background:#6BCBEF}
.who{min-width:0}
.who b{display:block;font-size:1.02rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--head-sub);font-size:.8rem;margin-top:1px}
main{flex:1 1 auto;overflow-y:auto;padding:10px 4% 8px;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch;
  background-color:var(--wall);
  background-image:radial-gradient(circle at 12px 12px,var(--doodle) 2.2px,transparent 2.6px),radial-gradient(circle at 44px 36px,var(--doodle) 1.6px,transparent 2px),radial-gradient(circle at 30px 58px,var(--doodle) 3px,transparent 3.4px);
  background-size:64px 70px}
.wrapc{max-width:880px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:2px}
.msg{position:relative;max-width:min(80%,520px);padding:6px 8px 8px 9px;border-radius:7.5px;line-height:1.38;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--in);box-shadow:var(--shadow);align-self:flex-start;margin-top:2px;animation:pop .18s ease-out}
.msg.first{margin-top:10px;border-top-left-radius:0}
.msg.first::before{content:"";position:absolute;top:0;left:-8px;border-top:0 solid transparent;border-right:8px solid var(--in);border-bottom:10px solid transparent}
.msg.me{align-self:flex-end;background:var(--out)}
.msg.me.first{border-top-left-radius:7.5px;border-top-right-radius:0}
.msg.me.first::before{left:auto;right:-8px;border-right:0;border-left:8px solid var(--out)}
.msg a{color:var(--link)}
.msg img{display:block;max-width:240px;max-height:260px;border-radius:6px;margin-bottom:2px}
.meta{float:right;display:inline-flex;align-items:center;gap:3px;margin:6px 0 -4px 10px;font-size:.68rem;color:var(--meta);white-space:nowrap;position:relative;top:4px}
.meta svg{color:var(--tick)}
@keyframes pop{from{transform:translateY(4px);opacity:0}}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;margin-top:10px;border-radius:7.5px;border-top-left-radius:0;background:var(--in);box-shadow:var(--shadow);position:relative}
.typing::before{content:"";position:absolute;top:0;left:-8px;border-right:8px solid var(--in);border-bottom:10px solid transparent}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--meta);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-3px);opacity:1}0%,80%,100%{opacity:.4}}
.chip{align-self:center;margin:10px 0 4px;padding:5px 12px;border-radius:7.5px;background:var(--chip);color:var(--chip-text);font-size:.75rem;box-shadow:var(--shadow);text-transform:uppercase;letter-spacing:.02em}
.note{align-self:center;max-width:420px;margin:6px 0 8px;padding:6px 12px;border-radius:7.5px;background:var(--note);color:var(--note-text);font-size:.75rem;text-align:center;line-height:1.4;box-shadow:var(--shadow)}
footer{flex:0 0 auto;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--bar)}
.bar{display:flex;gap:6px;align-items:flex-end;max-width:880px;margin:0 auto}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:2px;background:var(--field);border-radius:24px;padding:2px 4px 2px 14px;box-shadow:var(--shadow)}
.field input[type=text]{flex:1;min-width:0;font:400 1rem "Segoe UI",-apple-system,Roboto,sans-serif;color:var(--text);background:transparent;border:0;padding:11px 0;outline:none}
.field input::placeholder{color:var(--meta)}
.ib{flex:0 0 40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:var(--meta);background:transparent}
.ib.send{flex:0 0 48px;height:48px;background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.ib:disabled{opacity:.55}
.err{align-self:center;color:var(--red);font-size:.84rem;text-align:center;padding:6px 10px;margin:6px 0;background:var(--chip);border-radius:7.5px}
.gone{margin:auto;text-align:center;color:var(--chip-text);padding:24px;line-height:1.5}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="av" id="initial">·</div>
  <div class="who"><b id="name">Loading…</b><small id="status">online</small></div>
</header>
<main id="scroller" aria-live="polite"><div class="wrapc" id="list"></div></main>
<footer id="foot">
  <div class="bar">
    <div class="field">
      <input type="text" id="text" placeholder="Message" maxlength="2000" autocomplete="off" enterkeyhint="send">
      <label class="ib" for="file" title="Send a screenshot" aria-label="Send a screenshot">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>
      </label>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <button class="ib send" id="send" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21.5 12 3.4 3.6l-.01 6.53L16.5 12 3.39 13.87z"/></svg>
    </button>
  </div>
</footer>
<script>
(function () {
  // Icons: Lucide (https://github.com/lucide-icons/lucide), ISC License.
  var API = "https://leqizarzgfpiriknpnxw.supabase.co/functions/v1/student-bot/chat";
  var SLUG = (new URLSearchParams(location.search).get("s") || "").toLowerCase();
  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), scroller = $("scroller"), shown = 0, busy = false, lastRole = "", lastDay = "";
  var TICKS = '<svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor" aria-hidden="true"><path d="M11.07.65 4.6 8.6 1.9 6.02.8 7.17l3.9 3.7L12.3 1.7zM14.9.65 8.43 8.6l-.95-.9-1.1 1.15 2.15 2.03L16.13 1.7z"/></svg>';
  function scrollEnd() { scroller.scrollTop = scroller.scrollHeight; }
  function hhmm(d) { return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
  function dayLabel(d) {
    var t = new Date(), y = new Date(Date.now() - 864e5);
    if (d.toDateString() === t.toDateString()) return "Today";
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString([], { day: "numeric", month: "long", year: "numeric" });
  }

  function visitorId() {
    var key = "eem26-chat-" + SLUG, v = null;
    try { v = localStorage.getItem(key); } catch (e) {}
    if (!v || !/^[a-z0-9]{16,40}$/.test(v)) {
      v = Array.from(crypto.getRandomValues(new Uint8Array(12)), function (b) { return b.toString(36).padStart(2, "0"); }).join("").slice(0, 24);
      try { localStorage.setItem(key, v); } catch (e) {}
    }
    return v;
  }
  var V = visitorId();

  var URL_RE = /(https?:\/\/[^\s<>"]+[^\s<>".,;:!?)])/g;
  function textWithLinks(text, out) {
    var last = 0, m; URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text))) {
      if (m.index > last) out.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement("a"); a.href = m[1]; a.target = "_blank"; a.rel = "noopener"; a.textContent = m[1];
      out.appendChild(a); last = m.index + m[1].length;
    }
    if (last < text.length) out.appendChild(document.createTextNode(text.slice(last)));
  }
  // Replies use a small HTML set (bold, italics, links); anything else becomes plain text.
  function safeHtml(html) {
    var root = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html").body.firstChild;
    function walk(node, linked) {
      var out = document.createDocumentFragment();
      node.childNodes.forEach(function (n) {
        if (n.nodeType === 3) { if (linked) out.appendChild(document.createTextNode(n.textContent)); else textWithLinks(n.textContent, out); return; }
        if (n.nodeType !== 1) return;
        var tag = n.tagName.toLowerCase(), href = n.getAttribute("href") || "";
        if (/^(b|strong|i|em|u|s|code|br)$/.test(tag)) { var el = document.createElement(tag); el.appendChild(walk(n, linked)); out.appendChild(el); }
        else if (tag === "a" && /^https?:\/\//i.test(href) && !linked) { var a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.appendChild(walk(n, true)); out.appendChild(a); }
        else out.appendChild(walk(n, linked));
      });
      return out;
    }
    return walk(root, false);
  }

  function bubble(role, text, img, at) {
    var when = at ? new Date(at) : new Date(), day = dayLabel(when);
    if (day !== lastDay) {
      lastDay = day; lastRole = "";
      var c = document.createElement("div"); c.className = "chip"; c.textContent = day; list.appendChild(c);
    }
    var mine = role === "user";
    var el = document.createElement("div");
    el.className = "msg" + (mine ? " me" : "") + (lastRole !== role ? " first" : "");
    lastRole = role;
    if (img) { var i = document.createElement("img"); i.src = img; i.alt = "Screenshot"; el.appendChild(i); }
    else if (mine) el.appendChild(document.createTextNode(text));
    else el.appendChild(safeHtml(text));
    var meta = document.createElement("span"); meta.className = "meta";
    meta.innerHTML = hhmm(when) + (mine ? " " + TICKS : "");
    el.appendChild(meta);
    var t = $("typing"); list.insertBefore(el, t || null);
    scrollEnd();
  }
  function typing(on) {
    var t = $("typing");
    $("status").textContent = on ? "typing…" : "online";
    if (on && !t) { t = document.createElement("div"); t.id = "typing"; t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>"; list.appendChild(t); lastRole = ""; scrollEnd(); }
    if (!on && t) t.remove();
  }
  function error(msg) {
    var el = document.createElement("div"); el.className = "err"; el.textContent = msg; list.appendChild(el); scrollEnd();
    setTimeout(function () { el.remove(); }, 6000);
  }
  function setName(n) {
    $("name").textContent = n; document.title = n;
    $("initial").textContent = (n || "·").trim().charAt(0).toUpperCase();
  }
  var note = document.createElement("div"); note.className = "note"; note.textContent = "🔒 Your chat is private. Replies arrive instantly, day and night.";
  list.appendChild(note);
  function wrap(r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); }

  // Pulls new replies (e.g. a payment confirmation sent later) that this page hasn't shown yet.
  function sync(first) {
    return fetch(API + "?s=" + encodeURIComponent(SLUG) + "&v=" + V).then(wrap).then(function (res) {
      if (!res.ok) { if (first) gone(res.j.error); return; }
      setName(res.j.name || "Assistant");
      var msgs = res.j.messages || [];
      if (!busy) {
        for (var i = shown; i < msgs.length; i++) bubble(msgs[i].role, msgs[i].role === "user" && /^\[.*\]$/.test(msgs[i].text) ? "📸 Screenshot sent" : msgs[i].text, null, msgs[i].at);
        shown = Math.max(shown, msgs.length);
      }
      if (first && !msgs.length) send({}, true);
    });
  }
  function gone(msg) {
    $("foot").classList.add("hidden");
    $("status").textContent = "";
    list.innerHTML = '<div class="gone"></div>';
    list.firstChild.textContent = msg || "This chat link isn't active.";
    setName("Chat");
  }

  function send(body, silent) {
    busy = true; $("send").disabled = true;
    body.s = SLUG; body.v = V;
    setTimeout(function () { if (busy) typing(true); }, silent ? 0 : 400);
    return fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(wrap)
      .then(function (res) {
        typing(false);
        if (!res.ok) return error(res.j.error || "Couldn't send. Please try again.");
        var replies = res.j.replies || [];
        var delay = 0;
        replies.forEach(function (r, k) {
          delay += k ? Math.min(1800, 500 + r.length * 8) : 0;
          setTimeout(function () { typing(false); bubble("assistant", r); if (k < replies.length - 1) typing(true); }, delay);
        });
        // This page already shows what was just sent and answered — skip it in the next sync.
        return fetch(API + "?s=" + encodeURIComponent(SLUG) + "&v=" + V).then(wrap).then(function (h) {
          if (h.ok) shown = (h.j.messages || []).length;
        });
      })
      .catch(function () { typing(false); error("Couldn't connect. Check your internet and try again."); })
      .then(function () { busy = false; $("send").disabled = false; });
  }

  function sendText() {
    var text = $("text").value.trim();
    if (!text || busy) return;
    $("text").value = "";
    bubble("user", text);
    send({ text: text });
  }
  $("send").addEventListener("click", sendText);
  $("text").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); sendText(); } });

  function compress(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.width, img.height));
        var c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  $("file").addEventListener("change", function () {
    var f = $("file").files[0]; $("file").value = "";
    if (!f || busy) return;
    compress(f).then(function (dataUrl) {
      bubble("user", "", dataUrl);
      send({ image: dataUrl.split(",")[1], mime: "image/jpeg", text: $("text").value.trim() });
      $("text").value = "";
    }).catch(function () { error("That image couldn't be opened."); });
  });

  if (!/^[a-z0-9-]{3,40}$/.test(SLUG)) return gone("This chat link isn't complete — check the link you were sent.");
  sync(true).catch(function () { error("Couldn't connect. Check your internet and try again."); });
  setInterval(function () { if (!busy && !document.hidden) sync(false).catch(function () {}); }, 8000);
})();
</script>
</body>
</html>
