<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Chat with us</title>
<meta name="description" content="Chat with us — we reply instantly, day and night.">
<meta name="theme-color" content="#000000">
<style>
:root{
  --blue:#0A84FF;--green:#30D158;--purple:#BF5AF2;--teal:#64D2FF;--red:#FF453A;
  --label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.34);
  --glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000}
body{color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(35% 30% at 15% 5%,rgba(10,132,255,.3),transparent 70%),radial-gradient(30% 28% at 90% 25%,rgba(191,90,242,.24),transparent 70%),radial-gradient(40% 30% at 50% 100%,rgba(48,209,88,.14),transparent 70%);filter:blur(40px)}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(28,28,30,.72);border-bottom:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.av{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.05rem;background:conic-gradient(from 210deg,var(--blue),var(--purple),#FF375F,#FF9F0A,var(--green),var(--blue));box-shadow:0 0 18px rgba(10,132,255,.45)}
.av span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#111}
.who b{display:block;font-size:1rem;font-weight:600}
.who small{display:flex;align-items:center;gap:6px;color:var(--green);font-size:.76rem;font-weight:500;margin-top:1px}
.who small i{width:7px;height:7px;border-radius:50%;background:currentColor}
main{flex:1 1 auto;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:8px;max-width:760px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.msg{max-width:84%;padding:10px 13px;border-radius:18px;line-height:1.45;font-size:.97rem;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--glass);border:1px solid var(--edge);border-bottom-left-radius:6px;align-self:flex-start;animation:pop .25s ease-out}
.msg.me{align-self:flex-end;background:var(--blue);border-color:transparent;border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.msg a{color:var(--teal);font-weight:600}
.msg.me a{color:#fff}
.msg img{display:block;max-width:220px;max-height:220px;border-radius:12px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.typing{align-self:flex-start;display:flex;gap:4px;padding:13px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--edge)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--label2);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-4px);opacity:1}0%,80%,100%{opacity:.35}}
.day{align-self:center;color:var(--label3);font-size:.72rem;font-weight:600;letter-spacing:.04em;padding:4px 0}
footer{flex:0 0 auto;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);background:rgba(28,28,30,.72);border-top:1px solid rgba(255,255,255,.08);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.bar{display:flex;gap:8px;align-items:center;max-width:760px;margin:0 auto}
.bar input[type=text]{flex:1;min-width:0;font:500 1rem -apple-system,Inter,sans-serif;color:var(--label);background:rgba(0,0,0,.45);border:1px solid var(--edge);border-radius:999px;padding:12px 15px;outline:none}
.bar input[type=text]:focus{border-color:var(--blue)}
.ib{flex:0 0 44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(255,255,255,.12)}
.ib.send{background:var(--blue)}
.ib:disabled{opacity:.5}
.note{text-align:center;color:var(--label3);font-size:.7rem;margin-top:6px}
.err{align-self:center;color:var(--red);font-size:.86rem;text-align:center;padding:6px}
.gone{margin:auto;text-align:center;color:var(--label2);padding:24px;line-height:1.5}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="av"><span id="initial">·</span></div>
  <div class="who"><b id="name">Loading…</b><small><i></i>Online · replies instantly</small></div>
</header>
<main id="list" aria-live="polite"></main>
<footer id="foot">
  <div class="bar">
    <label class="ib" for="file" title="Send a screenshot" aria-label="Send a screenshot">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg>
    </label>
    <input type="file" id="file" accept="image/*" hidden>
    <input type="text" id="text" placeholder="Type a message…" maxlength="2000" autocomplete="off" enterkeyhint="send">
    <button class="ib send" id="send" aria-label="Send">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
    </button>
  </div>
  <p class="note">Your chat is private.</p>
</footer>
<script>
(function () {
  // Icons: Lucide (https://github.com/lucide-icons/lucide), ISC License.
  var API = "https://leqizarzgfpiriknpnxw.supabase.co/functions/v1/student-bot/chat";
  var SLUG = (new URLSearchParams(location.search).get("s") || "").toLowerCase();
  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), shown = 0, busy = false;

  function visitorId() {
    var key = "eem26-chat-" + SLUG, v = null;
    try { v = localStorage.getItem(key); } catch (e) {}
    if (!v || !/^[a-z0-9]{16,40}$/.test(v)) {
      v = Array.from(crypto.getRandomValues(new Uint8Array(12)), function (b) { return b.toString(36).padStart(2, "0"); }).join("").slice(0, 24);
      try { localStorage.setItem(key, v); } catch (e) {}
    }
    return v;
  }
  var V = visitorId();

  var URL_RE = /(https?:\/\/[^\s<>"]+[^\s<>".,;:!?)])/g;
  function textWithLinks(text, out) {
    var last = 0, m; URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text))) {
      if (m.index > last) out.appendChild(document.createTextNode(text.slice(last, m.index)));
      var a = document.createElement("a"); a.href = m[1]; a.target = "_blank"; a.rel = "noopener"; a.textContent = m[1];
      out.appendChild(a); last = m.index + m[1].length;
    }
    if (last < text.length) out.appendChild(document.createTextNode(text.slice(last)));
  }
  // Replies use a small HTML set (bold, italics, links); anything else becomes plain text.
  function safeHtml(html) {
    var root = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html").body.firstChild;
    function walk(node, linked) {
      var out = document.createDocumentFragment();
      node.childNodes.forEach(function (n) {
        if (n.nodeType === 3) { if (linked) out.appendChild(document.createTextNode(n.textContent)); else textWithLinks(n.textContent, out); return; }
        if (n.nodeType !== 1) return;
        var tag = n.tagName.toLowerCase(), href = n.getAttribute("href") || "";
        if (/^(b|strong|i|em|u|s|code|br)$/.test(tag)) { var el = document.createElement(tag); el.appendChild(walk(n, linked)); out.appendChild(el); }
        else if (tag === "a" && /^https?:\/\//i.test(href) && !linked) { var a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.appendChild(walk(n, true)); out.appendChild(a); }
        else out.appendChild(walk(n, linked));
      });
      return out;
    }
    return walk(root, false);
  }

  function bubble(role, text, img) {
    var el = document.createElement("div");
    el.className = "msg" + (role === "user" ? " me" : "");
    if (img) { var i = document.createElement("img"); i.src = img; i.alt = "Screenshot"; el.appendChild(i); }
    else if (role === "user") el.textContent = text;
    else el.appendChild(safeHtml(text));
    list.appendChild(el);
    list.scrollTop = list.scrollHeight;
  }
  function typing(on) {
    var t = $("typing");
    if (on && !t) { t = document.createElement("div"); t.id = "typing"; t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>"; list.appendChild(t); list.scrollTop = list.scrollHeight; }
    if (!on && t) t.remove();
  }
  function error(msg) {
    var el = document.createElement("div"); el.className = "err"; el.textContent = msg; list.appendChild(el); list.scrollTop = list.scrollHeight;
    setTimeout(function () { el.remove(); }, 6000);
  }
  function setName(n) {
    $("name").textContent = n; document.title = "Chat with " + n;
    $("initial").textContent = (n || "·").trim().charAt(0).toUpperCase();
  }
  function wrap(r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); }

  // Pulls new replies (e.g. a payment confirmation sent later) that this page hasn't shown yet.
  function sync(first) {
    return fetch(API + "?s=" + encodeURIComponent(SLUG) + "&v=" + V).then(wrap).then(function (res) {
      if (!res.ok) { if (first) gone(res.j.error); return; }
      setName(res.j.name || "Assistant");
      var msgs = res.j.messages || [];
      if (!busy) {
        for (var i = shown; i < msgs.length; i++) bubble(msgs[i].role, msgs[i].role === "user" && /^\[.*\]$/.test(msgs[i].text) ? "📸 Screenshot sent" : msgs[i].text);
        shown = Math.max(shown, msgs.length);
      }
      if (first && !msgs.length) send({}, true);
    });
  }
  function gone(msg) {
    $("foot").classList.add("hidden");
    list.innerHTML = '<div class="gone"></div>';
    list.firstChild.textContent = msg || "This chat link isn't active.";
    setName("Chat");
  }

  function send(body, silent) {
    busy = true; $("send").disabled = true;
    body.s = SLUG; body.v = V;
    setTimeout(function () { if (busy) typing(true); }, silent ? 0 : 400);
    return fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }).then(wrap)
      .then(function (res) {
        typing(false);
        if (!res.ok) return error(res.j.error || "Couldn't send. Please try again.");
        var replies = res.j.replies || [];
        var delay = 0;
        replies.forEach(function (r, k) {
          delay += k ? Math.min(1800, 500 + r.length * 8) : 0;
          setTimeout(function () { bubble("assistant", r); }, delay);
        });
        // This page already shows what was just sent and answered — skip it in the next sync.
        return fetch(API + "?s=" + encodeURIComponent(SLUG) + "&v=" + V).then(wrap).then(function (h) {
          if (h.ok) shown = (h.j.messages || []).length;
        });
      })
      .catch(function () { typing(false); error("Couldn't connect. Check your internet and try again."); })
      .then(function () { busy = false; $("send").disabled = false; });
  }

  function sendText() {
    var text = $("text").value.trim();
    if (!text || busy) return;
    $("text").value = "";
    bubble("user", text);
    send({ text: text });
  }
  $("send").addEventListener("click", sendText);
  $("text").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); sendText(); } });

  function compress(file) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.width, img.height));
        var c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  $("file").addEventListener("change", function () {
    var f = $("file").files[0]; $("file").value = "";
    if (!f || busy) return;
    compress(f).then(function (dataUrl) {
      bubble("user", "", dataUrl);
      send({ image: dataUrl.split(",")[1], mime: "image/jpeg", text: $("text").value.trim() });
      $("text").value = "";
    }).catch(function () { error("That image couldn't be opened."); });
  });

  if (!/^[a-z0-9-]{3,40}$/.test(SLUG)) return gone("This chat link isn't complete — check the link you were sent.");
  sync(true).catch(function () { error("Couldn't connect. Check your internet and try again."); });
  setInterval(function () { if (!busy && !document.hidden) sync(false).catch(function () {}); }, 8000);
})();
</script>
</body>
</html>
